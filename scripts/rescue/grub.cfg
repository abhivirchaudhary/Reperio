# Reperio rescue USB. BIOS and UEFI boot from here.
set timeout=4
set default=0
search --no-floppy --label REPERIO --set=root

# Image builds for testing (GRUB_SERIAL_DEBUG=1) also talk on the serial
# port, so a virtual machine's boot can be watched without a screen.
set extra=""
if [ -f /boot/grub/serial-debug ]; then
    serial --unit=0 --speed=115200
    terminal_input serial console
    terminal_output serial console
    set extra="console=ttyS0,115200 reperio.serial=ttyS0"
    set timeout=1
fi

menuentry "Reperio rescue" {
    linux /boot/vmlinuz-lts root=LABEL=REPERIO rootfstype=iso9660 ro rootwait quiet console=tty0 $extra
    initrd /boot/initramfs-lts
}
menuentry "Reperio rescue (safe graphics, for screens that stay black)" {
    linux /boot/vmlinuz-lts root=LABEL=REPERIO rootfstype=iso9660 ro rootwait nomodeset console=tty0 $extra
    initrd /boot/initramfs-lts
}
menuentry "Reperio rescue (show boot messages)" {
    linux /boot/vmlinuz-lts root=LABEL=REPERIO rootfstype=iso9660 ro rootwait console=tty0 $extra
    initrd /boot/initramfs-lts
}
