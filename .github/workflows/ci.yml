name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests and recovery checks (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev ffmpeg mtools dosfstools exfatprogs exfat-fuse ntfs-3g \
            python3-fusepy imagemagick p7zip-full rar libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui
          sudo python3 -m pip install --break-system-packages pillow piexif fonttools
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - name: Build test cards
        run: sudo python3 scripts/make_test_cards.py /tmp/cards && sudo chown -R "$USER" /tmp/cards
      - name: Card integration tests
        run: REPERIO_TEST_CARDS=/tmp/cards cargo test --release -p reperio-engine --test cards
      - name: Format samples
        run: |
          python3 scripts/make_format_samples.py /tmp/samples
          REPERIO_TEST_SAMPLES=/tmp/samples cargo test --release -p reperio-engine --test samples
      - name: End-to-end recovery
        run: |
          cargo build --release -p reperio
          python3 scripts/e2e_check.py /tmp/cards target/release/reperio
      - name: Forensic imaging (hashes, report, verification)
        run: python3 scripts/forensic_check.py target/release/reperio
      - name: Rescue menu (loop devices)
        run: sudo python3 scripts/menu_check.py target/release/reperio
      - name: Video repair
        run: scripts/videofix_check.sh target/release/reperio
      - name: Damaged NTFS volumes
        run: sudo scripts/ntfs_damage_check.sh target/release/reperio

  macos:
    name: macOS app
    runs-on: macos-14
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint (macOS code paths)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      # With these repository secrets set, the app is signed with a
      # Developer ID and notarized by Apple; without them it is ad-hoc signed.
      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Build Reperio.app and .dmg (Apple Silicon + Intel)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/build-mac-app.sh
      - name: Build command-line tool
        run: |
          cargo build --release -p reperio --target aarch64-apple-darwin
          cargo build --release -p reperio --target x86_64-apple-darwin
          lipo -create -output reperio target/aarch64-apple-darwin/release/reperio target/x86_64-apple-darwin/release/reperio
      - uses: actions/upload-artifact@v4
        with:
          name: Reperio-macOS
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            reperio
          if-no-files-found: error

  rescue-usb:
    name: Rescue USB image (build and boot in QEMU)
    runs-on: ubuntu-24.04
    # Builds the image from Alpine Linux's published packages, so a change
    # on Alpine's side can break it without any change here; it does not
    # hold up the other checks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools grub-common grub-pc-bin grub-efi-amd64-bin \
            qemu-system-x86 ovmf
      - name: Build the image
        run: |
          cargo build --release -p reperio --target x86_64-unknown-linux-musl
          export REPERIO_BIN=$PWD/target/x86_64-unknown-linux-musl/release/reperio
          sudo -E env GRUB_SERIAL_DEBUG=1 REPERIO_BIN="$REPERIO_BIN" scripts/make-rescue-usb.sh
      - name: Boot it (BIOS and UEFI)
        run: BOOT_TIMEOUT=600 scripts/rescue_boot_check.sh reperio-rescue.iso
      - name: Build the shipping image (no test console)
        run: |
          rm reperio-rescue.iso*
          sudo -E env REPERIO_BIN="$PWD/target/x86_64-unknown-linux-musl/release/reperio" scripts/make-rescue-usb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Reperio-rescue-USB
          path: |
            reperio-rescue.iso
            reperio-rescue.iso.sha256
